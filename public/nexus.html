<!DOCTYPE html>
<!--
  NEXUS — games & AI hub. Single self-contained file, no server needed.
  Google Sites: Insert → Embed → Embed code → paste this whole file → Next → Insert,
  then drag the block to full width and make it tall (about 800px or more).
  Larger option: host this file (GitHub Pages, Netlify, Drive-hosted static site, etc.)
  and use Insert → Embed → By URL instead — same result, easier to update.
  Add external game links in Settings → Game links (or directly in the GAMES array below).
  Never paste an AI API key into this file; keys go in Settings and stay in the browser.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEXUS — Games & AI Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#0c0f16;--bg2:#121722;--bg3:#1a2130;--line:#232c3d;--line2:#34405a;
  --tx:#e9edf5;--tx2:#8d97ad;--acc:#3be0ff;--acc2:#ff3d8a;--ok:#5cf0a0;--warn:#ffb347;
  --r:14px;--nav:232px;--ai:380px;
  --font:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:3px solid var(--bg)}
.hide{display:none!important}
body.rm *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
#app{display:flex;height:100%;width:100%}
#nav{width:var(--nav);flex:none;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:3px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-weight:800;color:#0b0e14;font-size:18px;flex:none}
.brand b{font-size:17px;letter-spacing:.12em;font-weight:800;display:block;line-height:1.1}
.brand small{display:block;color:var(--tx2);font-size:11px}
.nv{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--tx2);width:100%;text-align:left;font-weight:500;transition:background .15s,color .15s}
.nv:hover{background:var(--bg3);color:var(--tx)}
.nv.on{background:var(--bg3);color:var(--tx);box-shadow:inset 3px 0 0 var(--acc)}
.nv .ic{width:22px;text-align:center;font-size:16px;flex:none}
.nv .n:empty{display:none}.nv .n{margin-left:auto;font-size:11px;color:var(--tx2);background:var(--bg);padding:1px 7px;border-radius:99px}
.navsec{color:var(--tx2);font-size:11px;padding:14px 10px 4px}
.navfoot{margin-top:auto;padding:12px 10px 4px;font-size:11px;color:var(--tx2);line-height:1.5}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--bg2)}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;transition:border-color .15s}
.search:focus-within{border-color:var(--acc)}
.search input{flex:1;background:none;border:0;outline:0;min-width:0;color:var(--tx)}
.search input::placeholder{color:var(--tx2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;background:var(--bg3);font-size:12px;font-weight:600;white-space:nowrap}
.pill b{color:var(--acc)}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--bg3);transition:background .15s;flex:none;font-size:16px}
.ib:hover{background:var(--line)}
.ib.on{background:var(--acc);color:#0b0e14}
.prof{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:99px;background:var(--bg3);font-weight:600;font-size:13px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#0b0e14;background:var(--acc);flex:none}
#content{flex:1;overflow:auto;padding:22px 24px 40px}
#content>section{max-width:1400px;margin:0 auto}
h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--tx2);margin-top:2px}
.sec{margin-top:28px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sech h3{font-size:16px;font-weight:700}
.link{color:var(--acc);font-weight:600;font-size:13px}
.link:hover{text-decoration:underline}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;background:linear-gradient(120deg,var(--bg2),var(--bg3));border:1px solid var(--line);border-radius:22px;padding:28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:520px;height:520px;right:-160px;top:-220px;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 28%,transparent),transparent 62%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:36px;line-height:1.08;font-weight:800;letter-spacing:-.025em;max-width:14ch}
.hero p{color:var(--tx2);margin:12px 0 18px;max-width:46ch}
.count{font-size:66px;font-weight:800;line-height:1;letter-spacing:-.03em;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.countl{color:var(--tx2);font-size:13px;margin:4px 0 18px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:11px;background:var(--bg3);font-weight:600;font-size:13px;border:1px solid var(--line);transition:background .15s,transform .1s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--line)}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--acc);color:#0b0e14;border-color:transparent}
.btn.p:hover{filter:brightness(1.08);background:var(--acc)}
.btn.d{color:#ff6b6b}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:9px}
.spot{border-radius:18px;overflow:hidden;position:relative;min-height:240px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;background-image:var(--g);cursor:pointer;border:1px solid rgba(255,255,255,.08)}
.spot::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(8,10,16,.85)),repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 6px,transparent 6px 16px)}
.spot .em{position:absolute;right:22px;top:18px;font-size:78px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.4))}
.spot>*{position:relative}
.spot h3{font-size:22px;font-weight:800}
.spot p{color:#c9d1e3;font-size:13px;margin:4px 0 12px;max-width:40ch}
.row{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
.row .card{width:214px;flex:none;scroll-snap-align:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{border-radius:14px;padding:14px;background-image:var(--g);position:relative;overflow:hidden;cursor:pointer;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid rgba(255,255,255,.08);transition:transform .15s}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(8,10,16,.7))}
.tile:hover{transform:translateY(-2px)}
.tile>*{position:relative}
.tile .em{font-size:26px}
.tile b{display:block;font-size:14px;margin-top:6px}
.tile small{color:#c9d1e3;font-size:11px}
.aiteaser{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:20px}
.aiteaser .big{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--acc2),var(--acc));display:grid;place-items:center;font-size:26px}
.aiteaser h3{font-size:16px}
.aiteaser p{color:var(--tx2);font-size:13px;margin:2px 0 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);font-size:12px;font-weight:500;transition:background .15s,color .15s;white-space:nowrap}
.chip:hover{background:var(--bg3)}
.chip.on{background:var(--acc);color:#0b0e14;border-color:transparent}
.empty{background:var(--bg2);border:1px dashed var(--line2);border-radius:16px;padding:26px;text-align:center;color:var(--tx2)}
.empty b{color:var(--tx);display:block;margin-bottom:4px}

/* ---------- game cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:14px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative;cursor:pointer;transition:transform .18s,border-color .18s}
.card:hover{transform:translateY(-3px);border-color:var(--line2)}
.thumb{aspect-ratio:16/10;position:relative;display:grid;place-items:center;background-image:var(--g);overflow:hidden}
.thumb::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.2),transparent 45%),repeating-linear-gradient(45deg,rgba(255,255,255,.045) 0 6px,transparent 6px 15px)}
.thumb .em{font-size:46px;position:relative;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45));transition:transform .2s}
.card:hover .thumb .em{transform:scale(1.12)}
.thumb .tag{position:absolute;left:8px;top:8px;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.fav{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:9px;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:grid;place-items:center;font-size:15px;color:#fff;transition:transform .12s}
.fav:hover{transform:scale(1.12)}
.fav.on{color:var(--acc2)}
.playov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,10,16,.55);opacity:0;transition:opacity .15s}
.card:hover .playov{opacity:1}
.pbtn{padding:8px 16px;border-radius:99px;background:var(--acc);color:#0b0e14;font-weight:700;font-size:12px}
.cbody{padding:10px 12px 12px}
.cbody h4{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbody p{font-size:11.5px;color:var(--tx2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.meta{display:flex;gap:6px;margin-top:8px;font-size:10.5px;color:var(--tx2);flex-wrap:wrap}
.meta span{background:var(--bg);padding:2px 7px;border-radius:6px}
.meta .live{color:var(--ok)}
.meta .need{color:var(--warn)}

/* ---------- viewer ---------- */
#viewer{position:fixed;inset:0;background:#070910;z-index:50;display:none;flex-direction:column}
#viewer.open{display:flex}
.vbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--line)}
.vbar .vt{flex:1;min-width:0}
.vbar h3{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar small{color:var(--tx2);font-size:11px;display:block}
.vstage{flex:1;position:relative;min-height:0;background:#070910}
.vstage iframe,.vstage canvas{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;outline:0}
.vfoot{padding:7px 14px;font-size:12px;color:var(--tx2);background:var(--bg2);border-top:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap}
.ph{position:absolute;inset:0;display:grid;place-items:center;padding:20px;overflow:auto}
.phbox{max-width:540px;width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:24px}
.phbox h3{font-size:18px;margin-bottom:6px}
.phbox p{color:var(--tx2);font-size:13px;margin-bottom:12px}
.phbox .f{margin-bottom:12px}

/* ---------- settings / forms ---------- */
.box{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;max-width:820px}
.box h3{font-size:15px;margin-bottom:4px}
.box .note{color:var(--tx2);font-size:12.5px;margin-bottom:14px;line-height:1.5}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.f label{font-size:12px;color:var(--tx2);font-weight:500}
.f input,.f select,.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:0;width:100%;transition:border-color .15s}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--acc)}
.f textarea{min-height:80px;resize:vertical}
.f select option{background:var(--bg2)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.swb{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.swb.on{border-color:#fff}
.tog{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px}
.tog input{width:auto}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--tx2);display:inline-block}
.status.ok i{background:var(--ok)}
.linklist{display:grid;gap:8px;max-height:420px;overflow:auto;padding-right:6px}
.linkrow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;font-size:12.5px}
.linkrow input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:0;width:100%;font-size:12px}
.linkrow input:focus{border-color:var(--acc)}
.linkrow b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkrow small{color:var(--tx2);display:block;font-weight:400}

/* ---------- AI panel ---------- */
#ai{width:0;flex:none;overflow:hidden;background:var(--bg2);border-left:1px solid var(--line);transition:width .2s}
#ai.open{width:var(--ai)}
.ai-in{width:var(--ai);height:100%;display:flex;flex-direction:column}
.ai-head{display:flex;align-items:center;gap:6px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line)}
.ai-head .t{flex:1;min-width:0}
.ai-head b{font-size:14px;display:block}
.ai-hist{border-bottom:1px solid var(--line);max-height:220px;overflow:auto;padding:8px}
.hrow{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:8px;font-size:12.5px;cursor:pointer}
.hrow:hover{background:var(--bg3)}
.hrow.on{background:var(--bg3);box-shadow:inset 2px 0 0 var(--acc)}
.hrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow button{color:var(--tx2);font-size:12px;padding:2px 6px;border-radius:6px}
.hrow button:hover{color:#ff6b6b;background:var(--bg)}
.msgs{flex:1;overflow:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.welcome{padding:6px 2px}
.welcome h3{font-size:16px;margin-bottom:4px}
.welcome p{color:var(--tx2);font-size:13px;margin-bottom:12px}
.welcome .chips .chip{font-size:12px}
.msg{max-width:94%;position:relative;font-size:13.5px;line-height:1.55}
.msg.u{align-self:flex-end;background:var(--acc);color:#0b0e14;padding:10px 13px;border-radius:14px 14px 4px 14px;white-space:pre-wrap;word-break:break-word}
.msg.a{align-self:flex-start;background:var(--bg3);padding:12px 14px;border-radius:14px 14px 14px 4px;word-break:break-word}
.msg.s{align-self:stretch;max-width:100%;background:transparent;border:1px dashed var(--line2);color:var(--tx2);padding:12px 14px;border-radius:12px;font-size:12.5px}
.msg.s b{color:var(--tx)}
.msg.a p{margin:0 0 8px}.msg.a p:last-child{margin:0}
.msg.a ul,.msg.a ol{margin:0 0 8px 18px}
.msg.a h4{font-size:14px;margin:10px 0 6px}
.msg.a pre{background:var(--bg);padding:10px 12px;border-radius:9px;overflow:auto;margin:8px 0;font-size:12px;line-height:1.5}
.msg.a code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--bg);padding:1px 5px;border-radius:5px}
.msg.a pre code{background:none;padding:0}
.mtools{display:flex;gap:6px;margin-top:8px}
.mtools button{font-size:11px;color:var(--tx2);background:var(--bg);padding:3px 8px;border-radius:6px}
.mtools button:hover{color:var(--tx)}
.typing{display:inline-flex;gap:4px;align-items:center;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--tx2);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.ai-form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:flex-end}
.ai-form textarea{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:0;resize:none;min-height:42px;max-height:160px;line-height:1.45}
.ai-form textarea:focus{border-color:var(--acc)}
.send{width:42px;height:42px;border-radius:12px;background:var(--acc);color:#0b0e14;display:grid;place-items:center;font-size:16px;flex:none}
.send:disabled{opacity:.5;cursor:default}
.ai-note{padding:0 14px 10px;font-size:11px;color:var(--tx2)}


/* ---------- 3D HUD ---------- */
.g3hud{position:absolute;inset:0;pointer-events:none;font-weight:700;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.g3hud .hl{position:absolute;left:16px;top:12px;color:#e9edf5}
.g3hud .hr{position:absolute;right:16px;top:12px;color:#c9d1e3}
.g3hud .hc{position:absolute;left:0;right:0;top:44px;text-align:center;font-size:20px;font-weight:800;color:var(--acc);letter-spacing:.08em}
.g3hud .cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.85);border-radius:50%}
.g3hud .cross::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;background:var(--acc);border-radius:50%;transform:translate(-50%,-50%)}
.g3hud .flash{position:absolute;inset:0;background:radial-gradient(circle,transparent 50%,rgba(255,60,80,.55));opacity:0}
.g3hud .flash.on{animation:fl .35s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
.g3hud .over{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:rgba(5,7,12,.7);pointer-events:none}
.g3hud .over h2{font-size:36px;font-weight:800}
.g3hud .over p{font-size:17px;color:var(--acc);margin:6px 0 10px}
.g3hud .over small{color:var(--tx2);font-weight:500}
/* ---------- tools ---------- */
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;max-width:1100px}
.tbox{margin:0;max-width:none}
.tbig{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tphase{color:var(--tx2);font-size:13px;margin-top:4px}
.trow{display:flex;gap:8px;margin-bottom:12px}
.trow input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:0;min-width:0}
.trow input:focus{border-color:var(--acc)}
.todos{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.todo{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:8px 10px}
.todo label{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;min-width:0}
.todo span{overflow:hidden;text-overflow:ellipsis}
.todo.done span{text-decoration:line-through;color:var(--tx2)}
.todo button{color:var(--tx2);padding:2px 6px;border-radius:6px}
.todo button:hover{color:#ff6b6b}
.notes{width:100%;min-height:200px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0;resize:vertical;line-height:1.5}
.notes:focus{border-color:var(--acc)}
.calcout{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.calcout div{display:flex;justify-content:space-between;gap:10px;background:var(--bg);padding:8px 10px;border-radius:8px;font-variant-numeric:tabular-nums}
.calcout span{color:var(--tx2);overflow:hidden;text-overflow:ellipsis}
.calcout .err b{color:#ff6b6b;font-weight:500;font-size:12px}
#tbadge{cursor:pointer}
#tbadge b{color:var(--acc)}
/* ---------- mobile nav, toast ---------- */
#mnav{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);justify-content:space-around;padding:6px 4px max(6px,env(safe-area-inset-bottom));z-index:40}
#mnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--tx2);padding:4px 8px;border-radius:10px;min-width:56px}
#mnav button .ic{font-size:18px}
#mnav button.on{color:var(--acc)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--bg3);border:1px solid var(--line2);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  #nav{display:none}
  #content{padding:16px 14px 90px}
  .hero{grid-template-columns:1fr;padding:20px}
  .hero h1{font-size:28px}

  #tbadge{display:none!important}
  #mnav{display:flex}
  #ai{position:fixed;inset:0;width:100%;border:0;z-index:60;display:none;transition:none}

  .prof span{display:none}
  .search{max-width:none}
  .gc{display:none}
  .f2{grid-template-columns:1fr}
  .linkrow{grid-template-columns:1fr}
  .aiteaser{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .row .card{width:180px}
  .vfoot{padding-bottom:max(7px,env(safe-area-inset-bottom))}
}

const byId=id=>GAMES.find(g=>g.id===id);

const playable=g=>!!(g.b||st.links[g.id]);
function saveSet(){store.set('settings',st.set);applySettings()}
function applySettings(){
  const a=ACCENTS[st.set.accent]||ACCENTS.cyan;
  document.documentElement.style.setProperty('--acc',a[0]);
  document.documentElement.style.setProperty('--acc2',a[1]);
  document.body.classList.toggle('rm',!!st.set.rm);
  const av=$('#av');av.textContent=(st.set.name||'P').trim().charAt(0).toUpperCase()||'P';av.style.background=st.set.color;

/* ================= RENDER HELPERS ================= */
const grad=c=>`--g:linear-gradient(135deg,${CATS[c][2]},${CATS[c][3]})`;
function card(g){
  const c=CATS[g.c];const fav=isFav(g.id);
  const state=g.b?'<span class="live">3D · plays here</span>':(st.links[g.id]?'<span class="live">Linked</span>':'<span class="need">Needs link</span>');
  return `<div class="card" data-act="open" data-id="${g.id}" style="${grad(g.c)}" role="button" tabindex="0" aria-label="Play ${esc(g.t)}">
    <div class="thumb"><span class="em">${g.e}</span><span class="tag">${c[0]}</span>
      <button class="fav ${fav?'on':''}" data-act="fav" data-id="${g.id}" aria-label="${fav?'Remove from favorites':'Add to favorites'}">${fav?'♥':'♡'}</button>
      <div class="playov"><span class="pbtn">▶ Play</span></div></div>
    <div class="cbody"><h4>${esc(g.t)}</h4><p>${esc(g.d)}</p><div class="meta"><span>${esc(g.p)}</span>${state}${st.scores[g.id]?`<span>Best ${st.scores[g.id]}</span>`:''}</div></div></div>`;
}
const grid=list=>list.length?`<div class="grid">${list.map(card).join('')}</div>`:'';
const row=list=>`<div class="row">${list.map(card).join('')}</div>`;

/* ================= VIEWS ================= */
function renderHome(){

  const rec=st.recent.map(r=>byId(r.id)).filter(Boolean).slice(0,10);
  const counts={};GAMES.forEach(g=>counts[g.c]=(counts[g.c]||0)+1);
  return `<section>
  <div class="hero">
    <div>
      <h1>Play hard. Then get the work done.</h1>
      <p>A fast hub of 3D browser games — shooters, racing, drift, arcade, platformers and more — with an AI assistant and a focus timer sitting right beside them.</p>
      <div class="count">${GAMES.length}</div><div class="countl">games in the library · ${GAMES.filter(g=>g.b).length} full-3D games play instantly, the rest link to external games you choose</div>
      <div class="btns"><button class="btn p" data-view="games" data-cat="all">Browse all games</button><button class="btn" data-act="ai-open">Open AI assistant</button></div>
    </div>
    <div class="spot" data-act="open" data-id="${spot.id}" style="${grad(spot.c)}" role="button" tabindex="0">
      <span class="em">${spot.e}</span>
      <small style="color:#c9d1e3">Spotlight · ${CATS[spot.c][0]}</small><h3>${esc(spot.t)}</h3><p>${esc(spot.d)}</p>
      <div><span class="pbtn">▶ Play now</span></div>
    </div>
  </div>
  <div class="sec"><div class="sech"><h3>Featured</h3><button class="link" data-view="games" data-cat="all">See all</button></div>${row(feat)}</div>
  <div class="sec"><div class="sech"><h3>Recently played</h3>${rec.length?'<button class="link" data-act="clear-recent">Clear</button>':''}</div>
    ${rec.length?row(rec):'<div class="empty"><b>Nothing played yet</b>Open any game and it will show up here.</div>'}</div>
  <div class="sec"><div class="sech"><h3>Categories</h3></div><div class="tiles">${Object.keys(CATS).map(k=>`<div class="tile" data-view="games" data-cat="${k}" style="${grad(k)}" role="button" tabindex="0"><span class="em">${CATS[k][1]}</span><b>${CATS[k][0]}</b><small>${counts[k]||0} games</small></div>`).join('')}</div></div>
  <div class="sec"><div class="aiteaser"><div class="big">✦</div><div><h3>AI assistant for school and work</h3><p>Homework, writing, math, coding, research, brainstorming, summaries. Pick a starting point:</p>
    <div class="chips">${PROMPTS.map(p=>`<button class="chip" data-act="prompt" data-p="${esc(p[1])}">${p[0]}</button>`).join('')}</div></div></div></div>
  </section>`;
}

function go(view,opts={}){
  if(view==='ai'){openAI(true);return}
  st.view=view;if(opts.cat!==undefined)st.cat=opts.cat;
  const c=$('#content');
  c.innerHTML=view==='games'?renderGames():view==='favorites'?renderFavs():view==='settings'?renderSettings():view==='tools'?renderTools():renderHome();
  if(view==='tools')tickTimer();
  c.scrollTop=0;
  $$('#nav .nv,#mnav button').forEach(b=>{const on=b.dataset.view===view&&(view!=='games'||(b.dataset.cat||'all')===st.cat||(!b.dataset.cat));b.classList.toggle('on',!!on&&b.dataset.view!=='ai')});
  if(view==='games'){$$('#nav .nv[data-view=games]').forEach(b=>b.classList.toggle('on',b.dataset.cat===st.cat));$('#mnav button[data-view=games]').classList.add('on')}

}
function rerender(){go(st.view)}

function aiStatus(){

function conv(){return st.convs.find(c=>c.id===st.cur)}
function newConv(){const c={id:'c'+Date.now(),title:'New chat',ms:[],ts:Date.now()};st.convs.unshift(c);st.cur=c.id;saveConvs();return c}
function saveConvs(){st.convs=st.convs.slice(0,40);store.set('convs',st.convs);store.set('cur',st.cur)}
function md(s){
  const blocks=[];
  s=esc(s).replace(/```(\w+)?\n?([\s\S]*?)```/g,(m,l,c)=>{blocks.push(`<pre><code>${c.replace(/\n$/,'')}</code></pre>`);return '\u0000'+(blocks.length-1)+'\u0000'});
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<i>$2</i>');
  let out='',list=null;
  for(const ln of s.split('\n')){
    const ul=/^\s*[-*•] (.*)/.exec(ln),ol=/^\s*\d+[.)] (.*)/.exec(ln);
    if(ul||ol){const t=ul?'ul':'ol';if(list!==t){if(list)out+=`</${list}>`;out+=`<${t}>`;list=t}out+=`<li>${(ul||ol)[1]}</li>`;continue}
    if(list){out+=`</${list}>`;list=null}
    const h=/^#{1,4} (.*)/.exec(ln);
    if(h)out+=`<h4>${h[1]}</h4>`;else if(ln.trim())out+=`<p>${ln}</p>`;
  }
  if(list)out+=`</${list}>`;
  return out.replace(/\u0000(\d+)\u0000/g,(m,i)=>blocks[i]).replace(/<p>(<pre>[\s\S]*?<\/pre>)<\/p>/g,'$1');
}
function renderAI(){
  aiStatus();const c=conv();const box=$('#msgs');
  if(!c||!c.ms.length){
    box.innerHTML=`<div class="welcome"><h3>What are you working on?</h3><p>Ask anything for school or work. Conversations are saved in this browser.</p><div class="chips">${PROMPTS.map(p=>`<button class="chip" data-act="prompt" data-p="${esc(p[1])}">${p[0]}</button>`).join('')}</div></div>`;

      `<div class="msg a">${md(m.c)}<div class="mtools"><button data-act="copy" data-i="${i}">Copy</button><button data-act="regen" data-i="${i}">Retry</button></div></div>`).join('');
  }
  box.scrollTop=box.scrollHeight;renderHist();
}
function renderHist(){

  h.innerHTML=st.convs.length?st.convs.map(c=>`<div class="hrow ${c.id===st.cur?'on':''}" data-act="conv" data-id="${c.id}"><span>${esc(c.title)}</span><button data-act="conv-del" data-id="${c.id}" aria-label="Delete chat">✕</button></div>`).join(''):'<div class="hrow" style="color:var(--tx2)">No chats yet</div>';
}
let busy=false;
async function send(text){
  text=(text||'').trim();if(!text||busy)return;
  let c=conv()||newConv();
  c.ms.push({r:'user',c:text});if(c.title==='New chat')c.title=text.slice(0,42)+(text.length>42?'…':'');saveConvs();
  $('#aiin').value='';autosize();renderAI();
  const a=st.ai;
  if(a.provider==='none'||(a.provider!=='custom'&&!a.key)){
    c.ms.push({r:'sys',c:'<b>The assistant isn\u2019t connected to an AI API yet.</b> Open AI settings (⚙ above) and choose a provider. Your message is saved here and you can press Retry once it\u2019s set up.'});saveConvs();renderAI();return;
  }
  busy=true;$('#aisend').disabled=true;
  const box=$('#msgs');const tp=document.createElement('div');tp.className='msg a';tp.innerHTML='<div class="typing"><i></i><i></i><i></i></div>';box.appendChild(tp);box.scrollTop=box.scrollHeight;
  try{
    const reply=await callAI(c.ms.filter(m=>m.r!=='sys').slice(-20));
    c.ms.push({r:'assistant',c:reply});
  }catch(err){
    c.ms.push({r:'sys',c:'<b>Request failed.</b> '+esc(err.message||err)+' Check the provider, model, key and endpoint in AI settings, then press Retry.'});
  }
  busy=false;$('#aisend').disabled=false;saveConvs();renderAI();
}
async function callAI(ms){
  const a=st.ai;const msgs=ms.map(m=>({role:m.r==='user'?'user':'assistant',content:m.c}));
  let res,data;
  if(a.provider==='anthropic'){
    res=await fetch(a.endpoint||'https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':a.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:a.model||'claude-sonnet-4-6',max_tokens:1500,system:a.system,messages:msgs})});
    data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.error?.message||('HTTP '+res.status));
    return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n')||'(empty reply)';
  }
  if(a.provider==='openai'){
    res=await fetch(a.endpoint||'https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+a.key},
      body:JSON.stringify({model:a.model||'gpt-4o-mini',messages:[{role:'system',content:a.system},...msgs]})});
    data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.error?.message||('HTTP '+res.status));
    return data.choices?.[0]?.message?.content||'(empty reply)';
  }
  res=await fetch(a.endpoint||LUMEN,{method:'POST',headers:Object.assign({'content-type':'application/json'},a.key?{'authorization':'Bearer '+a.key}:{}),body:JSON.stringify({messages:msgs,system:a.system,model:a.model||undefined})});
  data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error((typeof data.error==='string'?data.error:data.error?.message)||('HTTP '+res.status));
  return data.reply||data.content||data.text||JSON.stringify(data);
}
function copyText(t){
  const done=()=>toast('Copied');
  if(navigator.clipboard?.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>fallback())}else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('Copy failed')}ta.remove()}
}
function autosize(){const t=$('#aiin');t.style.height='auto';t.style.height=Math.min(160,t.scrollHeight)+'px'}

/* ================= FOCUS TIMER & TOOLS ================= */
const MODES={'25/5':[25,5],'50/10':[50,10],'15/3':[15,3],'90/15':[90,15]};
function saveFocus(){store.set('focus',st.focus)}
function remaining(){return Math.max(0,st.focus.end-Date.now())}
function focusLocked(){return st.focus.lock&&st.focus.phase==='focus'&&remaining()>0}
function fmt(ms){const s=Math.ceil(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function startPhase(phase){const [f,b]=MODES[st.focus.mode]||MODES['25/5'];st.focus.phase=phase;st.focus.paused=0;st.focus.end=Date.now()+(phase==='focus'?f:b)*60000;saveFocus();tickTimer()}
let timerI=null;
function tickTimer(){
  clearInterval(timerI);const f=st.focus;const badge=$('#tbadge');
  const paint=()=>{
    const r=remaining();
    if(f.phase!=='idle'&&!f.paused&&r<=0){const was=f.phase;if(was==='focus'){f.sessions++;startPhase('break');toast('Focus done — take a break');sfx('win')}else{f.phase='idle';saveFocus();toast('Break over — ready for another round?');sfx('pick')}if(st.view==='tools'){$('#content').innerHTML=renderTools()}}
    const show=f.phase!=='idle';badge.classList.toggle('hide',!show);if(show){$('#tbadgev').textContent=fmt(f.paused?f.paused:remaining());$('#tbadgel').textContent=f.phase==='focus'?'focus':'break'}
    $('#navtimer').textContent=show?fmt(f.paused?f.paused:remaining()):'';
    const big=$('#tbig');if(big){big.textContent=fmt(f.paused?f.paused:(f.phase==='idle'?(MODES[f.mode]||MODES['25/5'])[0]*60000:remaining()));$('#tphase').textContent=f.phase==='idle'?'Ready':(f.phase==='focus'?'Focus':'Break')+(f.paused?' · paused':'')}
  };
  paint();if(f.phase!=='idle')timerI=setInterval(paint,500);
}
function renderTools(){
  const f=st.focus;const running=f.phase!=='idle';
  return `<section><h2>Focus & Tools</h2><div class="sub">Timer, to-do, notes and a calculator — the stuff you actually use between games.</div><div style="height:18px"></div>
  <div class="tgrid">
    <div class="box tbox"><h3>Focus timer</h3><div class="note">Work in rounds, then play in the break.</div>
      <div class="chips" style="margin-bottom:14px">${Object.keys(MODES).map(m=>`<button class="chip ${f.mode===m?'on':''}" data-act="f-mode" data-m="${m}" ${running?'disabled':''}>${m.replace('/',' min · ')} min</button>`).join('')}</div>

/* --- Velocity X (circuit racer, laps + AI) --- */
DEFS.velocity={controls:'W/↑ throttle · S brake · A/D steer · Shift boost · 3 laps against 3 AI cars',
 pt(i,n){const a=i/n*Math.PI*2;return{x:Math.cos(a)*(78+Math.sin(a*3)*22),z:Math.sin(a)*(58+Math.cos(a*2)*16)}},

    for(const side of[10.2,-10.2]){const kb=e.box(len+2.5,.45,.7,i%2?0xff3d8a:0xffffff,.55);kb.position.set((a.x+b.x)/2+(dz/len)*side,.22,(a.z+b.z)/2-(dx/len)*side);kb.rotation.y=-Math.atan2(dz,dx)}}
  const sl=e.box(1.2,.1,20,0xffffff,.8);sl.position.set(s.path[0].x,.15,s.path[0].z);
  s.car=e.car(0x3be0ff);s.x=s.path[0].x;s.z=s.path[0].z;s.a=Math.atan2(-(s.path[1].z-s.path[0].z),s.path[1].x-s.path[0].x);
  s.vx=0;s.vz=0;s.lap=1;s.node=0;s.t=0;s.boost=100;

 update(e,dt){const s=e.s,k=e.k;s.t+=dt;

/* --- Mech Arena (third-person mech duel) --- */
DEFS.mech={controls:'WASD move · mouse aim · click/Space cannon · Shift dash · destroy 3 enemy mechs',
 init(e){const s=e.s,T=THREE;e.lights(0x4b5a84,0x12161f,1);e.fog(0x101522,40,180);e.floor(120,0x181f30);e.grid(120,40,0x2c3a5c);
  s.rects=[{x:0,z:-58,w:120,d:3},{x:0,z:58,w:120,d:3},{x:-58,z:0,w:3,d:120},{x:58,z:0,w:3,d:120}];
  for(let i=0;i<10;i++){const w=R(6,14),d=R(6,14),x=R(-45,45),z=R(-45,45);if(Math.hypot(x,z)<14)continue;s.rects.push({x,z,w,d});

  s.mk=(col)=>{const g=new T.Group();const torso=e.box(3,2.4,2.4,col,.3,g);torso.position.y=4.6;
    const head=e.box(1.2,.9,1.2,0x0b1020,0,g);head.position.set(0,6.2,.4);head.material.emissive=new T.Color(col);head.material.emissiveIntensity=.9;
    for(const side of[-1,1]){const leg=e.box(.9,3.4,.9,0x2a3348,0,g);leg.position.set(side*1,1.7,0);const arm=e.box(.8,.8,3,col,.4,g);arm.position.set(side*2.1,4.8,.6)}
    e.scene.add(g);return g};
  s.P=s.mk(0x3be0ff);s.p={x:0,z:30,hp:200,yaw:Math.PI,cd:0,dash:0};
  s.en=[];for(let i=0;i<3;i++){const g=s.mk(0xff3d8a);const a=i/3*Math.PI*2;s.en.push({g,x:Math.cos(a)*36,z:Math.sin(a)*36,hp:140,cd:R(1,2.5),st:1,think:0})}
  s.shots=[];s.sg=new T.SphereGeometry(.45,8,8);s.sm=new T.MeshBasicMaterial({color:0x3be0ff});s.sm2=new T.MeshBasicMaterial({color:0xff3d8a});

 update(e,dt){const s=e.s,k=e.k,m=e.m,p=s.p,T=THREE;s.t+=dt;

    let bx=0,bz=0;if(d>30){bx=dx/d;bz=dz/d}else if(d<16){bx=-dx/d;bz=-dz/d}bx+=-dz/d*o.st;bz+=dx/d*o.st;const bl=Math.hypot(bx,bz)||1;
    o.x+=bx/bl*10*dt;o.z+=bz/bl*10*dt;e.circleRect(o,2,s.rects);o.g.position.set(o.x,0,o.z);o.g.rotation.y=Math.atan2(dx,dz)+Math.PI;

/* --- Dead Zone (survival shooter) --- */
DEFS.deadzone={controls:'WASD move · mouse aim · click/Space fire · grab ammo crates · survive as long as you can',
 init(e){const s=e.s,T=THREE;e.lights(0x39415e,0x0a0d14,.85);e.fog(0x0a0d14,30,120);e.floor(110,0x11151d);e.grid(110,44,0x1e2636);
  s.rects=[{x:0,z:-53,w:110,d:3},{x:0,z:53,w:110,d:3},{x:-53,z:0,w:3,d:110},{x:53,z:0,w:3,d:110}];
  for(let i=0;i<16;i++){const w=R(5,13),d=R(5,13),x=R(-44,44),z=R(-44,44);if(Math.hypot(x,z)<9)continue;s.rects.push({x,z,w,d});

  const P=new T.Group();const body=e.cyl(.55,.55,1.7,0x5cf0a0,.35,P);body.position.y=.9;const head=e.sph(.32,0xdfe6ff,.4,P);head.position.y=2;
  const gun=e.box(.18,.18,1.1,0x0b1020,0,P);gun.position.set(.4,1.3,-.6);e.scene.add(P);
  s.P=P;s.p={x:0,z:0,hp:100,yaw:0,cd:0,ammo:60};s.z=[];s.crates=[];s.t=0;s.kills=0;s.sp=1.2;s.crateT=8;
  s.zg=new T.CylinderGeometry(.45,.45,1.8,8);

  s.bg=new T.SphereGeometry(.16,6,6);s.bm=new T.MeshBasicMaterial({color:0xffffff});s.bul=[];
  e.cam.position.set(0,22,18)},
 update(e,dt){const s=e.s,k=e.k,m=e.m,p=s.p,T=THREE;s.t+=dt;
  let mx=(k.right?1:0)-(k.left?1:0),mz=(k.down?1:0)-(k.up?1:0);if(mx&&mz){mx*=.707;mz*=.707}
  p.x+=mx*13*dt;p.z+=mz*13*dt;e.circleRect(p,.6,s.rects);
